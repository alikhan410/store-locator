# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fc0568978e5a7a64c4020dc35c935330"
name = "Storetrail"
application_url = "https://wx-ul-wow-actors.trycloudflare.com"
embedded = true
handle = "storetrail"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-07"

# Mandatory compliance webhooks (required for public apps)
# See: https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance
[[webhooks.subscriptions]]
uri = "/webhooks/customers/data_request"
compliance_topics = ["customers/data_request"]

[[webhooks.subscriptions]]
uri = "/webhooks/customers/redact"
compliance_topics = ["customers/redact"]

[[webhooks.subscriptions]]
uri = "/webhooks/shop/redact"
compliance_topics = ["shop/redact"]

# App lifecycle webhooks
[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

[[webhooks.subscriptions]]
uri = "/webhooks/app/scopes_update"
topics = ["app/scopes_update"]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_app_proxy,write_themes"

[auth]
redirect_urls = [
  "https://wx-ul-wow-actors.trycloudflare.com/auth/callback",
  "https://wx-ul-wow-actors.trycloudflare.com/auth/shopify/callback",
  "https://wx-ul-wow-actors.trycloudflare.com/api/auth/callback"
]

[app_proxy]
url = "/app-proxy/storetrail"
subpath = "storetrail"
prefix = "apps"

[pos]
embedded = false
